<!DOCTYPE html>
<html lang="en">
<head>

<title>Amanat Dashboard</title>

<link rel="stylesheet" href="dashboard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">

    <div class="logo-section">
        <img src="amanat-logo.png" class="logo-img">
        <span class="logo-text">Amanat</span>
    </div>

    <nav class="nav-links">
        <a class="active">Feed</a>
        <a href="bookmarks.html">Bookmarks</a>
        <a href="hidden.html">Hidden</a>
        <a href="challenges.html">Challenges</a>

    <div class="user-section">

        <span id="welcomeName">Hi, User</span>

        <img id="userAvatar" src="https://via.placeholder.com/40" class="avatar">

        
    </div>

</header>

<!-- HERO -->
<section class="hero">

    <p>Your safe space to share thoughts anonymously</p>

    <input type="text" id="searchInput" placeholder="Search posts...">

<section class="posts-section">

</section>

<section class="cta-section">
    <h2>Be the pioneer who breaks the silence.</h2>
    <a href="writing.html" class="cta-btn">Start Writing</a>

    <div class="footer-container">

        <div class="footer-logo">
            <img src="amanat-logo.png" width="60">
        </div>

        <div class="footer-col">
            <h3>Help Centre</h3>
            <p>Writing</p>

            <p>Copyright</p>
        </div>

        <!-- CONTACT -->
        <div class="footer-col">
            <h3>Contact Us</h3>
            <p>english@amanat.com</p>
            <p>Amanat Technologies Pvt Ltd</p>
            <p>Virar, Maharashtra</p>

    </div>

</footer>

<!--  JS AT END -->
<script src="dashboard.js"></script>
